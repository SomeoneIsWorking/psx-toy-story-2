<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Toy Story 2 port icon</title>
  <desc id="description">A toy rocket climbing past a star on a sky-blue backdrop with clouds.</desc>
  <defs>
    <linearGradient id="backdrop" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d8fe0"/>
      <stop offset="1" stop-color="#123c7a"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="106" fill="url(#backdrop)"/>
  <rect x="35" y="35" width="442" height="442" rx="91" fill="none" stroke="#ffffff" stroke-width="6" opacity=".75"/>

  <g filter="url(#shadow)" stroke-linejoin="round">
    <g fill="#fff" opacity=".9">
      <ellipse cx="140" cy="380" rx="70" ry="30"/><ellipse cx="190" cy="360" rx="50" ry="36"/>
      <ellipse cx="380" cy="140" rx="56" ry="24"/>
    </g>
    <path d="M330 300l20 50 54 4-42 34 14 52-46-30-46 30 14-52-42-34 54-4Z" fill="#ffd23c" stroke="#123c7a" stroke-width="9"/>
    <g transform="rotate(35 256 230)">
      <path d="M256 90c40 40 52 110 40 190h-80c-12-80 0-150 40-190Z" fill="#e8e8f0" stroke="#123c7a" stroke-width="12"/>
      <circle cx="256" cy="170" r="22" fill="#6ad04a" stroke="#123c7a" stroke-width="8"/>
      <path d="M216 230l-40 60h44M296 230l40 60h-44" fill="#8a4ad0" stroke="#123c7a" stroke-width="10"/>
      <path d="M232 290l24 50 24-50Z" fill="#ff7a1c"/>
    </g>
  </g>
</svg>
